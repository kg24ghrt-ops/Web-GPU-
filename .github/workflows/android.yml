name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 3

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Stage frontend runtime assets
        run: npm run build

      - name: Verify staged runtime assets
        run: |
          test -f dist/index.html
          test -f dist/css/index.css
          test -f dist/js/main.js
          test -f dist/js/gpu/shaders/paper.wgsl
          test -f dist/js/gpu/shaders/ink.wgsl
          test -f dist/js/gpu/shaders/composite.wgsl
          echo "Runtime assets staged OK"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          platform-tools: true

      - name: Setup Android NDK
        uses: android-actions/setup-ndk@v2
        with:
          ndk-version: r27c

      - name: Export Android environment variables
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}" >> $GITHUB_ENV
          echo "ANDROID_NDK_PATH=${ANDROID_NDK_PATH}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT}" >> $GITHUB_ENV
          echo "JAVA_HOME=${JAVA_HOME}" >> $GITHUB_ENV

      - name: Print toolchain versions
        run: |
          echo "=== Node ===" && node --version && npm --version
          echo "=== Rust ===" && rustc --version && cargo --version
          echo "=== Rust targets ===" && rustup target list --installed
          echo "=== Java ===" && java -version 2>&1 | head -1
          echo "=== Android SDK ===" && sdkmanager --version
          echo "=== Android NDK ===" && ndk-build --version 2>&1 | head -1

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Initialize Tauri Android project (if not already generated)
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init
          else
            echo "src-tauri/gen/android already exists, skipping init"
          fi

      - name: Verify Android minimum SDK version
        run: |
          for f in src-tauri/gen/android/app/build.gradle src-tauri/gen/android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/minSdkVersion [0-9][0-9]*/minSdkVersion 26/g' "$f"
              sed -i 's/minSdk = [0-9][0-9]*/minSdk = 26/g' "$f"
              echo "=== $f minSdk ==="
              grep -E "minSdk" "$f" || true
            fi
          done

      - name: Build Android debug APK
        run: |
          npx tauri build --target aarch64-linux-android

      - name: Locate generated APK
        id: apk
        run: |
          APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated" >&2
            echo "Contents of src-tauri/gen/android:" >&2
            find src-tauri/gen/android -maxdepth 4 -type f | sort >&2
            exit 1
          fi
          echo "APK path: $APK"
          ls -lh "$APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload Android debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notebook-android-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30
          overwrite: true
